name: release

# release-please keeps a "release PR" open on main (version bump + CHANGELOG, from
# conventional commits). Merging it tags vX.Y.Z and creates the GitHub release; the
# build job then attaches one figure-<target>.tar.gz (+ .sha256) per platform,
# which install.sh downloads. Building here rather than on `release: published`
# because releases created with GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="figure-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/figure LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "figure-${{ matrix.target }}.tar.gz" "figure-${{ matrix.target }}.tar.gz.sha256" --clobber
