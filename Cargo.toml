[package]
name = "figure"
version = "0.2.0"
edition = "2024"
description = "Compact, extracted code maps for AI agents: module manifests, symbols, recipes and dependencies."
license = "MIT"
repository = "https://github.com/rafalfigura/figure"
readme = "README.md"
keywords = ["ai", "code-map", "agents", "cli", "rust"]
rust-version = "1.85"
# `examples/<language>/` holds fixture projects that figure is tested on, not cargo examples.
autoexamples = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
